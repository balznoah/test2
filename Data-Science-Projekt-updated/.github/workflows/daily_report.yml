name: Daily Energy Forecast

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Python 3.10 einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: Pipeline ausführen
        env:
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
          GMAIL_APP_PW: ${{ secrets.GMAIL_APP_PW }}
          REPORT_RECIPIENTS: ${{ secrets.REPORT_RECIPIENTS }}
        run: |
          cd src
          python main.py

      - name: Datenbank speichern
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add src/energy_data.db
          git diff --staged --quiet || git commit -m "Update Datenbank [skip ci]"
          git push
